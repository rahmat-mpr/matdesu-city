<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MatDesu City</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #14161c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; }
    #hint { position: fixed; left: 8px; bottom: 8px; padding: 3px 7px; font: 12px monospace; color: #fff; background: rgba(0, 0, 0, 0.45); border-radius: 3px; opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hint">WASD / Arrows or tap to move</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
